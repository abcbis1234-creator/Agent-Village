services:
  agent-village:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      LLM_PRESET: "ollama"
      LLM_BASE_URL: "http://ollama:11434/v1"
      LLM_MODEL: "llama3.1"
      # Optional image generation:
      # SD_BASE_URL: "http://stable-diffusion:7860"
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
