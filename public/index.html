<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Village</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">🏘️</span>
        <div><h1>Agent Village</h1><p class="tag">8 roles · 3 layers</p></div>
      </div>
      <button id="new-conv" class="new-btn" type="button"><span>+ New conversation</span><kbd>⌘K</kbd></button>
      <h2>Conversations</h2>
      <ul id="conversations" class="conversations"></ul>
      <h2>Agents</h2>
      <ul id="agents" class="agents"></ul>

      <h2>Town</h2>
      <div id="town-stats" class="town-stats">loading…</div>
      <div id="god-buttons" class="god-buttons">
        <button type="button" data-action="airdrop">🪂 Airdrop</button>
        <button type="button" data-action="smite">⚡ Smite</button>
        <button type="button" data-action="weather">🌧 Weather</button>
        <button type="button" data-action="blackout">🔌 Blackout</button>
        <button type="button" data-action="rumor">🗣 Rumor</button>
        <button type="button" data-action="festival">🎉 Festival</button>
      </div>
      <button id="tick" class="tick-btn" type="button">▶ Run a tick</button>
      <a class="chronicle-link" href="/api/chronicle" target="_blank" rel="noopener">📰 Open chronicle</a>

      <h2>Wants</h2>
      <form id="want-form" class="want-form">
        <input id="want-input" placeholder="Post a want…" maxlength="200" />
        <button type="submit">Post</button>
      </form>
      <ul id="wants" class="wants"></ul>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 id="conv-title">Select a conversation</h2>
        <span id="phase" class="phase" hidden></span>
      </header>
      <div id="transcript" class="transcript" role="log" aria-live="polite"></div>
      <form id="composer" class="composer">
        <label for="message" class="sr-only">Message</label>
        <input id="message" name="message" autocomplete="off" placeholder="Try: what is 12*8+4?, what time is it?, remember that the sky is blue" maxlength="2000" required />
        <button type="submit">Send</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </main>
  </div>
  <div id="palette" class="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Command palette">
      <input id="palette-input" type="text" placeholder="Jump to conversation…" />
      <ul id="palette-list" class="palette-list"></ul>
    </div>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
